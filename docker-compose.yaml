services:
  bank-officer:
    build: .
    image: agent-foundations-bank-officer
    pull_policy: build
    env_file: [.env]
    environment:
      # Listen on all interfaces inside the container; the port mapping below decides exposure.
      BANK_WEB_HOST: "0.0.0.0"
      BANK_WEB_PORT: "8050"
    ports:
      - "8050:8050"
    volumes:
      # Saved transcripts and logs survive container restarts.
      - ./conversations:/app/conversations
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8050/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
