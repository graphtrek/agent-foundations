# --- C) Jogosultság: ügyfélváltás a kérdés közben és részleges válasz ---------------------------
# A kiválasztott ügyfél (premium) szintje alapján a router tévesen elutasíthatja az üzleti ügyfél adatait:
# a helyes viselkedés az ügyfélváltás után az új ügyfél szintjével dönteni (Kovács Bence = business).
- id: access_switch_to_higher_tier_customer
  customer: cust-001
  question: Most Kovács Bencével foglalkozunk. Mutasd az üzleti számláinak összesített áttekintését.
  expected_any_tools: [ask_account_specialist, get_business_overview]
  must_contain_numbers: [6700000]

# Fordított irány: a kiválasztott ügyfél (business) szintje elég volna, de a váltás után Szabó Emese (retail)
# kártyalimitje tilos. A router által nem védett profilokban a specialista-kapu / tool-ellenőrzés tartja meg.
- id: access_switch_to_lower_tier_customer
  customer: cust-002
  question: Most Szabó Emesével foglalkozunk. Mennyi a betéti kártyájának napi vásárlási limitje?
  expect_access_denied: true

# Kerülőút kísérlet: a kérdésből nem derül ki a "limit" kulcsszó, mégis a tiltott végpont adatát kéri
- id: access_denied_indirect_phrasing
  customer: cust-003
  question: Az ügyfél tudni szeretné, naponta legfeljebb mennyi készpénzt vehet fel automatából a kártyájával.
  expect_access_denied: true

# Vegyes kérés: az egyenleg megengedett, az üzleti áttekintés nem. A jó válasz a megengedett részt megadja,
# a tiltottat pedig a jogosultsági üzenettel utasítja el (a teljes elutasítás vagy a tiltott adat kiadása is hibás).
- id: access_mixed_allowed_and_denied
  customer: cust-001
  question: Mondd meg a számlák egyenlegét, és mutasd az üzleti számlák összesített áttekintését is.
  must_contain_numbers: [482350, 3120000]
  must_contain_text: [jogosultsági szint]

