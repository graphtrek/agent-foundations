# Eval cases for the architecture comparison (evals/run.py). Deterministic checks only:
#   customer              customer id selected before the question (null = none)
#   expected_endpoint     endpoint_id the router should match (only scored when a router runs)
#   expected_any_tools    at least one of these tools must be called
#   must_contain_numbers  numbers that must appear in the reply (formatting ignored: 482 350 = 482,350)
#   must_contain_text     case-insensitive fragments that must appear in the reply; 'a|b' accepts either
#   question / must_contain_text may be a map {hu: ..., en: ...}: the run language picks the entry
#   expect_access_denied  the reply must be the entitlement refusal
cases:
# cust-001: számlák (account) + igénylés és reklamáció (service) + ajánlat (product)
- id: wide_customer_summary_premium
  customer: cust-001
  question:
    hu: Készíts az ügyfélről rövid összefoglalót a beszélgetéshez - egyenlegek, folyamatban lévő igénylés, nyitott reklamáció és a számára elérhető ajánlatok.
    en: Give me a short summary of the customer for the conversation - balances, the application in progress, the open complaint and the offers available to them.
  expected_any_tools: [ask_account_specialist, list_accounts]
  must_contain_numbers: [482350, 3120000, 25000000, 15990]
  must_contain_text:
    hu: [betét]
    en: ["deposit|betét"]
# cust-002: magánszámlák + hitelek + üzleti áttekintés + letiltott kártya
- id: wide_customer_summary_business
  customer: cust-002
  question:
    hu: Mi a teljes képünk az ügyfélről? Magánszámlák egyenlege, fennálló hitelállomány, üzleti számlák összege és van-e letiltott kártyája (a kártya végződése is kell).
    en: What is our full picture of the customer? Balances of the private accounts, outstanding loans, the total of the business accounts and whether they have a blocked card (I also need the card's last digits).
  expected_any_tools: [ask_account_specialist, list_accounts]
  must_contain_numbers: [915420, 7480000, 24240000, 6700000, 3307]
# Hitel + folyószámla + ütemezett kifizetés együtt: törlesztők 298 500, egyenleg 915 420, fix ütemezett 370 000
- id: three_domain_liquidity_check
  customer: cust-002
  question:
    hu: Likviditás - mennyi a két hitel havi törlesztője együtt, mennyi van a folyószámlán, és mennyi a fix összegű ütemezett kifizetések összege?
    en: Liquidity - what is the combined monthly repayment of the two loans, how much is on the current account, and what is the total of the fixed-amount scheduled payments?
  expected_any_tools: [ask_product_specialist, list_existing_loans]
  must_contain_numbers: [298500, 915420, 370000]
# Két specialista: igénylés állapota (25 000 000 Ft) + általános feltételek (THM 7,3%)
- id: mortgage_application_and_conditions
  customer: cust-001
  question:
    hu: Hol tart az ügyfél lakáshitel-igénylése, mekkora összegre szól, és mi a lakáshitel THM-je az általános feltételek szerint?
    en: Where does the customer's mortgage application stand, what amount is it for, and what is the APR of the mortgage according to the general conditions?
  expected_any_tools: [ask_service_specialist, get_loan_application_status]
  must_contain_numbers: [25000000, 73]
# Nov. kiadás: étterem 8 450 + eMAG 15 990 = 24 440; a 100 000 Ft-os megtakarítási átvezetés nem költés
- id: spending_excludes_transfers
  customer: cust-001
  question:
    hu: Mennyi a tényleges költése az ügyfélnek 2026 novemberében? A saját számlák közötti átvezetéseket ne számold bele.
    en: What is the customer's actual spending in November 2026? Do not count transfers between their own accounts.
  expected_any_tools: [ask_account_specialist, summarize_spending]
  must_contain_numbers: [24440]
# A kiválasztott ügyfél (premium) szintje alapján a router tévesen elutasíthatja az üzleti ügyfél adatait:
# a helyes viselkedés az ügyfélváltás után az új ügyfél szintjével dönteni (Kovács Bence = business).
- id: access_switch_to_higher_tier_customer
  customer: cust-001
  question:
    hu: Most Kovács Bencével foglalkozunk. Mutasd az üzleti számláinak összesített áttekintését.
    en: We are now dealing with Bence Kovács. Show the consolidated overview of his business accounts.
  expected_any_tools: [ask_account_specialist, get_business_overview]
  must_contain_numbers: [6700000]
# Vegyes kérés: az egyenleg megengedett, az üzleti áttekintés nem. A jó válasz a megengedett részt megadja,
# a tiltottat pedig a jogosultsági üzenettel utasítja el (a teljes elutasítás vagy a tiltott adat kiadása is hibás).
- id: access_mixed_allowed_and_denied
  customer: cust-001
  question:
    hu: Mondd meg a számlák egyenlegét, és mutasd az üzleti számlák összesített áttekintését is.
    en: Tell me the balances of the accounts, and also show the consolidated overview of the business accounts.
  must_contain_numbers: [482350, 3120000]
  must_contain_text:
    hu: [jogosultsági szint]
    en: [entitlement tier]


# Limit lekérdezés (GET), nem kártyalista és nem limitmódosítás (PATCH): napi ATM-limit 200 000
- id: route_card_limits_not_list
  customer: cust-001
  question:
    hu: Mennyi a betéti kártya napi ATM-készpénzfelvételi limitje?
    en: What is the debit card's daily ATM cash withdrawal limit?
  expected_endpoint: ep-cards-get-limits
  expected_any_tools: [ask_service_specialist, get_card_limits]
  must_contain_numbers: [200000]
