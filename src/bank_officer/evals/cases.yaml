# =================================================================================================
# Architektúra-megkülönböztető esetek. Cél: ne mindegyik profil kapja ugyanazt az eredményt.
# Futtatás: --arch router,no_router,single_agent --repeat 3
# Mit mérnek: (A) router: hasonló végpontok közti választás, csak routerrel pontozott endpoint
# ellenőrzés; (B) delegálás: több területet átfogó kérdések, ahol a single_agent egy kontextusban
# viszi végig a láncot, a delegáló profilokban pedig minden specialista csak a saját részét látja;
# (C) jogosultság: a kódszintű router-rövidzár, a specialista-kapu és a tool-szintű ellenőrzés
# különbözően viselkedik, ha a kiválasztott ügyfél a kérdés közben vált.
# =================================================================================================

# --- A) Router: közeli végpontok, köznyelv, elütések --------------------------------------------
- id: route_statement_not_transactions
  customer: cust-001
  question: Kérem a folyószámla 2026. októberi havi kivonatát.
  expected_endpoint: ep-accounts-statement
  expected_any_tools: [ask_account_specialist, get_account_statement]

