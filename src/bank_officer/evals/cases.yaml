# Eval cases for the architecture comparison (evals/run.py). Deterministic checks only:
#   customer              customer id selected before the question (null = none)
#   expected_endpoint     endpoint_id the router should match (only scored when a router runs)
#   expected_any_tools    at least one of these tools must be called
#   must_contain_numbers  numbers that must appear in the reply (formatting ignored: 482 350 = 482,350)
#   must_contain_text     case-insensitive fragments that must appear in the reply
#   expect_access_denied  the reply must be the entitlement refusal
cases:
# cust-001: számlák (account) + igénylés és reklamáció (service) + ajánlat (product)
- id: wide_customer_summary_premium
  customer: cust-001
  question: Készíts az ügyfélről rövid összefoglalót a beszélgetéshez - egyenlegek, folyamatban lévő igénylés, nyitott reklamáció és a számára elérhető ajánlatok.
  expected_any_tools: [ask_account_specialist, list_accounts]
  must_contain_numbers: [482350, 3120000, 25000000, 15990]
  must_contain_text: [betét]
# cust-002: magánszámlák + hitelek + üzleti áttekintés + letiltott kártya
- id: wide_customer_summary_business
  customer: cust-002
  question: Mi a teljes képünk az ügyfélről? Magánszámlák egyenlege, fennálló hitelállomány, üzleti számlák összege és van-e letiltott kártyája (a kártya végződése is kell).
  expected_any_tools: [ask_account_specialist, list_accounts]
  must_contain_numbers: [915420, 7480000, 24240000, 6700000, 3307]
# Hitel + folyószámla + ütemezett kifizetés együtt: törlesztők 298 500, egyenleg 915 420, fix ütemezett 370 000
- id: three_domain_liquidity_check
  customer: cust-002
  question: Likviditás - mennyi a két hitel havi törlesztője együtt, mennyi van a folyószámlán, és mennyi a fix összegű ütemezett kifizetések összege?
  expected_any_tools: [ask_product_specialist, list_existing_loans]
  must_contain_numbers: [298500, 915420, 370000]
# Két specialista: igénylés állapota (25 000 000 Ft) + általános feltételek (THM 7,3%)
- id: mortgage_application_and_conditions
  customer: cust-001
  question: Hol tart az ügyfél lakáshitel-igénylése, mekkora összegre szól, és mi a lakáshitel THM-je az általános feltételek szerint?
  expected_any_tools: [ask_service_specialist, get_loan_application_status]
  must_contain_numbers: [25000000, 73]
# Reklamáció (tk-001-1) + a hozzá tartozó tranzakció (15 990 Ft, eMAG): ügyfélszolgálat + számla
- id: ticket_and_matching_transaction
  customer: cust-001
  question: Az ügyfél reklamált egy eMAG vásárlást. Mi a reklamáció állapota, és melyik számláról, mekkora összeggel könyvelték a tranzakciót?
  expected_any_tools: [ask_service_specialist, get_support_ticket_status]
  must_contain_numbers: [15990]
  must_contain_text: [eMAG]
# Nov. kiadás: étterem 8 450 + eMAG 15 990 = 24 440; a 100 000 Ft-os megtakarítási átvezetés nem költés
- id: spending_excludes_transfers
  customer: cust-001
  question: Mennyi a tényleges költése az ügyfélnek 2026 novemberében? A saját számlák közötti átvezetéseket ne számold bele.
  expected_any_tools: [ask_account_specialist, summarize_spending]
  must_contain_numbers: [24440]
# Megtakarítási számla novemberben: -100 000 + 100 000 + 3 300 + 50 000 = +53 300
- id: savings_net_change_november
  customer: cust-001
  question: Mennyivel változott a megtakarítási számla egyenlege 2026 novemberében a ki- és befizetések, átvezetések és kamatok együttes hatására?
  expected_any_tools: [ask_account_specialist, get_transaction_history, get_account_statement]
  must_contain_numbers: [53300]
# A kiválasztott ügyfél (premium) szintje alapján a router tévesen elutasíthatja az üzleti ügyfél adatait:
# a helyes viselkedés az ügyfélváltás után az új ügyfél szintjével dönteni (Kovács Bence = business).
- id: access_switch_to_higher_tier_customer
  customer: cust-001
  question: Most Kovács Bencével foglalkozunk. Mutasd az üzleti számláinak összesített áttekintését.
  expected_any_tools: [ask_account_specialist, get_business_overview]
  must_contain_numbers: [6700000]
# Fordított irány: a kiválasztott ügyfél (business) szintje elég volna, de a váltás után Szabó Emese (retail)
# kártyalimitje tilos. A router által nem védett profilokban a specialista-kapu / tool-ellenőrzés tartja meg.
- id: access_switch_to_lower_tier_customer
  customer: cust-002
  question: Most Szabó Emesével foglalkozunk. Mennyi a betéti kártyájának napi vásárlási limitje?
  expect_access_denied: true
# Vegyes kérés: az egyenleg megengedett, az üzleti áttekintés nem. A jó válasz a megengedett részt megadja,
# a tiltottat pedig a jogosultsági üzenettel utasítja el (a teljes elutasítás vagy a tiltott adat kiadása is hibás).
- id: access_mixed_allowed_and_denied
  customer: cust-001
  question: Mondd meg a számlák egyenlegét, és mutasd az üzleti számlák összesített áttekintését is.
  must_contain_numbers: [482350, 3120000]
  must_contain_text: [jogosultsági szint]

# Igénylés állapota (nem a meglévő hitelek listája, nem új igénylés): 25 000 000 Ft
- id: route_loan_status_not_list_or_apply
  customer: cust-001
  question: Hol tart most az ügyfél hitelkérelme?
  expected_endpoint: ep-loans-status
  expected_any_tools: [ask_service_specialist, get_loan_application_status]
  must_contain_numbers: [25000000]

# Limit lekérdezés (GET), nem kártyalista és nem limitmódosítás (PATCH): napi ATM-limit 200 000
- id: route_card_limits_not_list
  customer: cust-001
  question: Mennyi a betéti kártya napi ATM-készpénzfelvételi limitje?
  expected_endpoint: ep-cards-get-limits
  expected_any_tools: [ask_service_specialist, get_card_limits]
  must_contain_numbers: [200000]
