  catalog (src/bank_officer/endpoint_catalog.py, shown as a menu in
  catalog.html) is implemented as a screen or action here, including the
  POST/PATCH/DELETE endpoints. Fully client-side: the MOCK fixtures below
  are copied from catalog.html (which mirrors src/bank_officer/bank_data.py
  by hand) - keep them in sync. Write actions change a per-browser copy of
  the data saved in localStorage; "Demó visszaállítása" resets it.
  Served by src/bank_officer/main.py (http://127.0.0.1:8050/mobile.html) or
  open directly (file://); no build step, no network needed.
-->

  body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }

  .row.tap { cursor: pointer; } .row.tap:active { background: var(--panel2); }

  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; z-index: 20; }
  .scrim.open { display: flex; }
  .sheet { background: var(--panel); width: 100%; max-height: 88%; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 16px 16px 22px; animation: up .18s ease-out; }

  .sheet h3 { margin: 0 0 10px; font-size: 1.05rem; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sheet h3 button { background: none; border: 0; font-size: 1.4rem; color: var(--muted); cursor: pointer; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .9rem; }

  .toast { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); background: #222b; color: #fff; padding: 9px 16px; border-radius: 999px; font-size: .85rem; z-index: 30; max-width: 90%; text-align: center; backdrop-filter: blur(6px); background: rgba(25,32,43,.92); }

const me = () => S.customers.find(c => c.id === S.cur);
const mine = list => list.filter(x => x.customer === S.cur);
const myAcc = id => S.accounts.find(a => a.id === id && a.customer === S.cur);
const anyAcc = id => myAcc(id) || S.businessAccounts.find(a => a.id === id && a.customer === S.cur);
const nextId = prefix => `${prefix}-${S.cur.slice(5)}-${++S.n + 100}`;
const amt = v => { const n = Number(String(v ?? "").replace(/[\s_]/g, "").replace(",", ".")); return Number.isFinite(n) ? Math.round(n) : NaN; };
const logOp = text => { S.log.unshift({ t: TODAY, who: S.cur, text }); S.log.length = Math.min(S.log.length, 30); };

function addTxn(accId, amount, description, category) {
  const a = anyAcc(accId);
  a.balance += amount;
  if (!myAcc(accId)) return; // business sub-accounts keep a balance only
  const n = S.transactions.filter(t => t.account === accId).length + 1;
  S.transactions.push({ id: `txn-${accId.slice(4)}-${pad(n)}`, account: accId, date: TODAY, amount, description, category, currency: "HUF" });
}

/* --- Mock REST API: one route per catalog endpoint ----------------------- */

const ROUTES = [], API_LOG = [];
const route = (method, pattern, tier, id, fn) => ROUTES.push({
  method, pattern, tier, id, fn, re: new RegExp("^" + pattern.replace(/\{(\w+)\}/g, "(?<$1>[^/]+)") + "$") });
const ok = (data, status = 200) => ({ status, data });
const err = (status, error) => ({ status, data: { error } });

function api(method, url, body = {}) {
  const [path, qs] = url.split("?");
  const q = Object.fromEntries(new URLSearchParams(qs || ""));
  let res = err(404, "Ismeretlen végpont"), tier = "retail", id = "";
  for (const r of ROUTES) {
    if (r.method !== method) continue;
    const m = r.re.exec(path);
    if (!m) continue;
    tier = r.tier; id = r.id;
    if (!S.cur) res = err(401, "Nincs bejelentkezve.");
    else if (!hasAccess(me(), r.tier)) res = err(403, `Ehhez a funkcióhoz ${TIER_HU[r.tier]} csomag szükséges.`);
    else { try { res = r.fn({ p: m.groups || {}, q, b: body }); } catch (e) { res = err(500, String(e)); } }
    break;
  }
  API_LOG.unshift({ method, url, status: res.status, tier, id, time: new Date().toLocaleTimeString("hu-HU") });
  API_LOG.length = Math.min(API_LOG.length, 40);
  if (method !== "GET") save();
  return res;
}

});
route("GET", "/accounts/{id}", "retail", "ep-accounts-get", ({ p }) => {
  const a = myAcc(p.id); if (!a) return err(404, "A számla nem található.");
  return ok(a);

route("GET", "/accounts/{id}/transactions", "retail", "ep-accounts-transactions", ({ p, q }) => {
  if (!myAcc(p.id)) return err(404, "A számla nem található.");
  const min = q.min_amount ? amt(q.min_amount) : null;
  const list = S.transactions.filter(t => t.account === p.id)
    .filter(t => min === null || Math.abs(t.amount) >= min)
    .filter(t => !q.since || t.date >= q.since)
    .sort((x, y) => y.date.localeCompare(x.date) || y.id.localeCompare(x.id));
  return ok(list);
});
route("POST", "/accounts/{id}/transactions/{txn_id}/dispute", "retail", "ep-accounts-dispute", ({ p, b }) => {
  if (!myAcc(p.id)) return err(404, "A számla nem található.");
  const t = S.transactions.find(x => x.id === p.txn_id && x.account === p.id);
  if (!t) return err(404, "A tranzakció nem található.");
  if (t.amount >= 0) return err(422, "Csak terhelést lehet vitatni.");
  if (S.disputes.some(d => d.txn === t.id)) return err(409, "Ezt a tranzakciót már vitattad.");
  const d = { id: nextId("dsp"), txn: t.id, reason: b.reason || "Nem ismerem fel", status: "submitted", date: TODAY };
  S.disputes.push(d); logOp(`Vitatott tranzakció: ${t.description} (${fmt(-t.amount)})`);
  return ok(d, 201);
});
route("GET", "/accounts/{id}/statements/{period}", "retail", "ep-accounts-statement", ({ p }) => {
  if (!myAcc(p.id)) return err(404, "A számla nem található.");
  if (!/^\d{4}-\d{2}$/.test(p.period)) return err(422, "A időszak formátuma ÉÉÉÉ-HH.");
  const all = S.transactions.filter(t => t.account === p.id);
  const items = all.filter(t => t.date.startsWith(p.period)).sort((x, y) => x.date.localeCompare(y.date));
  if (!items.length) return err(404, "Erre az időszakra nincs kivonat.");
  const after = all.filter(t => t.date.slice(0, 7) > p.period).reduce((s, t) => s + t.amount, 0);
  const closing = myAcc(p.id).balance - after;
  const sum = items.reduce((s, t) => s + t.amount, 0);
  return ok({ period: p.period, account: p.id, opening: closing - sum, closing, credits: items.filter(t => t.amount > 0).reduce((s, t) => s + t.amount, 0),
    debits: items.filter(t => t.amount < 0).reduce((s, t) => s + t.amount, 0), items });
});

// payments
function checkPayment(b, needFee = 0) {
  const from = myAcc(b.from); if (!from) return [null, err(422, "Válassz forrásszámlát.")];
  const a = amt(b.amount);
  if (!(a > 0)) return [null, err(422, "Az összegnek pozitívnak kell lennie.")];
  if (from.balance < a + needFee) return [null, err(422, "Nincs elegendő fedezet a számlán.")];
  return [{ from, a }, null];
}
route("POST", "/payments/transfer", "retail", "ep-payments-transfer", ({ b }) => {
  const [ctx, e] = checkPayment(b); if (e) return e;
  const to = myAcc(b.to);
  if (!to) return err(422, "Válassz célszámlát.");
  if (to.id === ctx.from.id) return err(422, "A forrás- és a célszámla nem egyezhet.");
  addTxn(ctx.from.id, -ctx.a, b.note || `Átvezetés (${to.id})`, "transfer_out");
  addTxn(to.id, ctx.a, b.note || `Átvezetés (${ctx.from.id})`, "transfer_in");
  logOp(`Átvezetés: ${fmt(ctx.a)} (${ctx.from.id} → ${to.id})`);
  return ok({ id: nextId("pay"), from: ctx.from.id, to: to.id, amount: ctx.a, fee: 0, date: TODAY, status: "booked" }, 201);
});
route("POST", "/payments/utility-bill", "retail", "ep-payments-utility", ({ b }) => {
  const [ctx, e] = checkPayment(b); if (e) return e;
  if (!BILLERS.includes(b.biller)) return err(422, "Ismeretlen szolgáltató.");
  if (!/^[0-9A-Za-z-]{6,20}$/.test(String(b.reference || ""))) return err(422, "A közlemény/azonosító 6-20 karakter legyen.");
  addTxn(ctx.from.id, -ctx.a, `${b.biller} - ${b.reference}`, "utility");
  logOp(`Számla befizetve: ${b.biller} ${fmt(ctx.a)}`);
  return ok({ id: nextId("pay"), biller: b.biller, reference: b.reference, amount: ctx.a, fee: 0, date: TODAY, status: "booked" }, 201);
});
route("POST", "/payments/external-transfer", "premium", "ep-payments-external", ({ b }) => {
  const fee = Math.max(4000, Math.round(amt(b.amount) * 0.004) || 0);
  const [ctx, e] = checkPayment(b, fee); if (e) return e;
  const iban = String(b.iban || "").replace(/\s/g, "").toUpperCase();
  if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(iban)) return err(422, "Érvénytelen IBAN.");
  if (!String(b.name || "").trim()) return err(422, "Add meg a kedvezményezett nevét.");
  addTxn(ctx.from.id, -(ctx.a + fee), `SWIFT: ${b.name} (${iban.slice(0, 6)}…)`, "transfer_out");
  logOp(`Nemzetközi átutalás: ${fmt(ctx.a)} → ${b.name}`);
  return ok({ id: nextId("pay"), iban, beneficiary: b.name, amount: ctx.a, fee, date: TODAY, status: "sent" }, 201);
});
route("POST", "/payments/batch", "business", "ep-payments-batch", ({ b }) => {
  const from = anyAcc(b.from); if (!from) return err(422, "Válassz forrásszámlát.");
  const items = Array.isArray(b.items) ? b.items : [];
  if (!items.length) return err(422, "Legalább egy tétel szükséges.");
  const bad = items.findIndex(i => !(amt(i.amount) > 0) || !String(i.name || "").trim());
  if (bad >= 0) return err(422, `A(z) ${bad + 1}. tétel hibás (név;IBAN;összeg).`);
  const total = items.reduce((s, i) => s + amt(i.amount), 0);
  if (from.balance < total) return err(422, "Nincs elegendő fedezet a teljes köteghez.");
  items.forEach(i => addTxn(from.id, -amt(i.amount), `Csoportos utalás: ${i.name}`, "transfer_out"));
  logOp(`Csoportos utalás: ${items.length} tétel, ${fmt(total)}`);
  return ok({ id: nextId("bat"), count: items.length, total, from: from.id, date: TODAY, status: "booked" }, 201);
});

route("PATCH", "/cards/{id}/limits", "premium", "ep-cards-limits", ({ p, b }) => {
  const c = myCard(p.id); if (!c) return err(404, "A kártya nem található.");

  if (!(v >= 0)) return err(422, "Érvénytelen limit.");
  if (v < row[2]) return err(422, `A limit nem lehet kisebb a ma felhasznált összegnél (${fmt(row[2])}).`);
  if (v > 2000000) return err(422, "A maximális limit 2 000 000 Ft.");

});

// Generic form sheet. fields: {n, l, t, o:[[value,label]], v, ph}. onSubmit(values) -> api result.
function formSheet(title, fields, submit, onSubmit, intro = "") {
  const inputs = fields.map(f => {
    const attr = `name="${f.n}" ${f.req === false ? "" : "required"}`;
    if (f.t === "select") return `<label class="f">${esc(f.l)}<select ${attr}>${f.o.map(([v, l]) => `<option value="${esc(v)}"${v === f.v ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></label>`;
    if (f.t === "textarea") return `<label class="f">${esc(f.l)}<textarea ${attr} placeholder="${esc(f.ph || "")}">${esc(f.v || "")}</textarea></label>`;
    return `<label class="f">${esc(f.l)}<input ${attr} type="${f.t || "text"}" ${f.t === "number" ? 'inputmode="numeric" min="0" step="any"' : ""} value="${esc(f.v ?? "")}" placeholder="${esc(f.ph || "")}"></label>`;
  }).join("");
  openSheet(title, `<form id="sheet-form">${intro}${inputs}<div class="err" id="form-err"></div><button class="btn block" type="submit">${esc(submit)}</button></form>`, sh => {
    sh.querySelector("form").addEventListener("submit", ev => {
      ev.preventDefault();
      const vals = Object.fromEntries(new FormData(ev.target).entries());
      const res = onSubmit(vals);
      if (res.status >= 400) { sh.querySelector("#form-err").textContent = res.data.error; return; }
      render();
    });
  });
}

    <div class="row tap" data-act="payForm" data-arg="external"><div class="ico">🌍</div><div class="grow"><div class="t">Nemzetközi (SWIFT) átutalás${lockMark("premium")}</div><div class="s">${tierBadge("premium")} · díj: 0,4%, min. 4 000 Ft</div></div>›</div>
    <div class="row tap" data-act="payForm" data-arg="batch"><div class="ico">📦</div><div class="grow"><div class="t">Csoportos utalás${lockMark("business")}</div><div class="s">${tierBadge("business")} · több kedvezményezett egyszerre</div></div>›</div></div>
    <div class="card"><h2>Ütemezett fizetések (${sp.length})</h2>${sp.map(s => `<div class="row"><div class="ico">🗓️</div>
      <div class="grow"><div class="t">${esc(s.beneficiary)}</div><div class="s">${esc(hu(s.frequency))} · következő: ${esc(s.next)} · ${statusBadge(s.status)}</div></div>
      <div style="text-align:right"><div class="amt">${fmt(s.amount)}</div><button class="btn sm danger" data-act="cancelSched" data-arg="${s.id}">Törlés</button></div></div>`).join("") || '<div class="empty">Nincs ütemezett fizetés.</div>'}</div>` };
};
ACT.cancelSched = id => { if (!confirm("Biztosan törlöd az ütemezett fizetést?")) return; const r = api("DELETE", `/payments/scheduled/${id}`);
  r.status < 400 ? (toast("Ütemezett fizetés törölve"), render()) : toast(r.data.error); };
ACT.payForm = kind => {
  const from = { n: "from", l: "Forrásszámla", t: "select", o: accOptions() };
  if (kind === "transfer") return formSheet("Átvezetés", [from, { n: "to", l: "Célszámla", t: "select", o: accOptions().reverse() },
    { n: "amount", l: "Összeg (Ft)", t: "number", ph: "50000" }, { n: "note", l: "Közlemény", req: false }], "Átvezetés", v => {
    const r = api("POST", "/payments/transfer", v);
    if (r.status < 400) receipt("Átvezetés sikeres", r.data.id, [["Honnan", esc(r.data.from)], ["Hová", esc(r.data.to)], ["Összeg", fmt(r.data.amount)], ["Díj", fmt(0)], ["Dátum", esc(r.data.date)]]);
    return r; });
  if (kind === "utility") return formSheet("Közüzemi számla", [from, { n: "biller", l: "Szolgáltató", t: "select", o: BILLERS.map(b => [b, b]) },
    { n: "reference", l: "Ügyfél-/számlaazonosító", ph: "pl. 12345678" }, { n: "amount", l: "Összeg (Ft)", t: "number", ph: "18200" }], "Befizetés", v => {
    const r = api("POST", "/payments/utility-bill", v);
    if (r.status < 400) receipt("Befizetés sikeres", r.data.id, [["Szolgáltató", esc(r.data.biller)], ["Azonosító", esc(r.data.reference)], ["Összeg", fmt(r.data.amount)], ["Dátum", esc(r.data.date)]]);
    return r; });
  if (kind === "external") return gate("premium", () => formSheet("Nemzetközi átutalás", [from, { n: "name", l: "Kedvezményezett neve" },
    { n: "iban", l: "IBAN", ph: "DE89 3704 0044 0532 0130 00" }, { n: "amount", l: "Összeg (Ft)", t: "number" }, { n: "note", l: "Közlemény", req: false }], "Átutalás", v => {
    const r = api("POST", "/payments/external-transfer", v);
    if (r.status < 400) receipt("Átutalás elküldve", r.data.id, [["Kedvezményezett", esc(r.data.beneficiary)], ["IBAN", esc(r.data.iban)], ["Összeg", fmt(r.data.amount)], ["Díj", fmt(r.data.fee)]]);
    return r; }));
  if (kind === "batch") return gate("business", () => formSheet("Csoportos utalás", [
    { n: "from", l: "Forrásszámla", t: "select", o: [...mine(S.businessAccounts), ...mine(S.accounts)].map(a => [a.id, `${a.product} · ${fmt(a.balance)}`]) },
    { n: "rows", l: "Tételek (soronként: név;IBAN;összeg)", t: "textarea", v: "Kiss Kft.;HU42117730161111101800000000;120000\nNagy Bt.;HU42117730161111101800000001;85000" }], "Köteg indítása", v => {
    const items = String(v.rows).split("\n").map(l => l.trim()).filter(Boolean).map(l => { const [name, iban, amount] = l.split(";"); return { name, iban, amount }; });
    const r = api("POST", "/payments/batch", { from: v.from, items });
    if (r.status < 400) receipt("Köteg elküldve", r.data.id, [["Tételek száma", r.data.count], ["Összesen", fmt(r.data.total)], ["Forrás", esc(r.data.from)]]);
    return r; }));
};

// --- Cards ---
const maskedLimit = (type) => type === "Credit limit";
SCREENS.cards = () => {
  const cards = api("GET", "/cards").data;
  return { html: cards.map(c => { const blocked = c.status.startsWith("blocked");
    return `<div class="card"><div class="vcard ${blocked ? "blocked" : c.kind === "credit" ? "credit" : ""}"><small>${esc(c.brand)}</small>
      <div class="num">${esc(c.number)}</div><small>Lejárat: ${esc(c.expires)} · ${esc(hu(c.kind))}</small></div>
      <div class="row"><div class="grow"><div class="t">${statusBadge(c.status)}</div><div class="s">${c.account === "-" ? "Hitelkártya" : "Számla: " + esc(c.account)}</div></div>
      <div class="btns" style="margin:0"><button class="btn sm alt" data-act="limits" data-arg="${c.id}">Limitek${lockMark("premium")}</button>
      ${blocked ? `<button class="btn sm" data-act="unblock" data-arg="${c.id}">Feloldás</button>` : `<button class="btn sm danger" data-act="block" data-arg="${c.id}">Tiltás</button>`}</div></div></div>`; }).join("") || '<div class="empty">Nincs kártyád.</div>' };
};
ACT.block = id => { if (!confirm("Biztosan letiltod a kártyát?")) return; const r = api("POST", `/cards/${id}/block`); toast(r.status < 400 ? "Kártya letiltva" : r.data.error); render(); };
ACT.unblock = id => { const r = api("POST", `/cards/${id}/unblock`); toast(r.status < 400 ? "Kártya feloldva" : r.data.error); render(); };
ACT.limits = id => {
  const r = api("GET", `/cards/${id}/limits`);
  if (r.status === 403) return lockedSheet("premium", r.data.error);
  if (r.status >= 400) return openSheet("Limitek", `<div class="empty">${esc(r.data.error)}</div>`);
  openSheet("Kártyalimitek", r.data.limits.map(l => `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><b>${esc(hu(l.type))}</b>
    <span>${fmt(l.limit)}</span></div><div class="bar"><i style="width:${l.limit ? Math.min(100, l.used / l.limit * 100) : 0}%"></i></div>
    <div class="s" style="display:flex;justify-content:space-between"><span>Ma felhasznált: ${fmt(l.used)}</span>
    ${maskedLimit(l.type) ? "" : `<button class="chip" data-act="editLimit" data-arg="${id}|${esc(l.type)}">Módosítás</button>`}</div></div>`).join(""));
};
ACT.editLimit = arg => {
  const [id, type] = arg.split("|");
  formSheet(hu(type), [{ n: "limit", l: "Új limit (Ft)", t: "number", ph: "300000" }], "Mentés", v => {
    const r = api("PATCH", `/cards/${id}/limits`, { type, limit: v.limit });
    if (r.status < 400) { toast("Limit módosítva"); ACT.limits(id); } return r; });
};

// --- Loans ---
SCREENS.loans = () => {
  const off = api("GET", "/loans/offers").data, loans = api("GET", "/loans").data, apps = mine(S.loanApplications);
  const lastStatus = a => a.history[a.history.length - 1][1];
  return { html: `<div class="btns"><button class="btn" data-act="applyLoan">Hitelkérelem${lockMark("premium")}</button>
    <button class="btn alt" data-act="creditLine">Üzleti hitelkeret${lockMark("business")}</button></div>
    <div class="card"><h2>Hiteleim (${loans.length})</h2>${loans.map(l => `<div class="row"><div class="ico">🏠</div><div class="grow"><div class="t">${esc(l.name)}</div>
      <div class="s">Törlesztő: ${fmt(l.payment)} · következő: ${esc(l.next)}</div><div class="bar"><i style="width:${(1 - l.balance / l.original) * 100}%"></i></div>
      <div class="s">Fennálló: ${fmt(l.balance)} / ${fmt(l.original)} · ${l.rate}% · lejárat: ${esc(l.maturity)}</div></div></div>`).join("") || '<div class="empty">Nincs fennálló hitelod.</div>'}</div>
    <div class="card"><h2>Kérelmeim (${apps.length})</h2>${apps.map(a => `<div class="row tap" data-act="loanStatus" data-arg="${a.id}"><div class="ico">📄</div>
      <div class="grow"><div class="t">${esc(loanName(a.product))}</div><div class="s">${fmt(a.amount)} · ${esc(a.id)}</div></div>${statusBadge(lastStatus(a))}</div>`).join("") || '<div class="empty">Nincs hitelkérelmed.</div>'}</div>
    <div class="card"><h2>Termékek és ajánlatok</h2>${off.products.map(p => { const o = off.offers.find(x => x.product === p.id);
      return `<div class="row"><div class="ico">${p.category === "mortgage" ? "🏠" : p.category === "savings" || p.category === "deposit" ? "🐖" : "💶"}</div>
      <div class="grow"><div class="t">${esc(p.name)}</div><div class="s">${esc(p.rateLabel)}: ${p.rate.toFixed(1)}%${o ? ` · <b>${esc(o.detail)}</b>` : ""}</div></div></div>`; }).join("")}</div>` };
};
ACT.loanStatus = id => {
  const r = api("GET", `/loans/applications/${id}/status`); if (r.status >= 400) return toast(r.data.error);
  const a = r.data;
  openSheet("Kérelem állapota", `${kvList([["Termék", esc(loanName(a.product))], ["Összeg", fmt(a.amount)], ["Állapot", statusBadge(a.status)], ["Frissítve", esc(a.updated)]])}
    <div class="timeline" style="margin-top:14px">${a.history.map(([d, s, n]) => `<div class="ev"><b>${esc(hu(s))}</b> <span class="muted small">${esc(d)}</span><div class="small">${esc(n)}</div></div>`).join("")}</div>`);
};
ACT.applyLoan = () => gate("premium", () => formSheet("Hitelkérelem", [
  { n: "product", l: "Termék", t: "select", o: MOCK.products.filter(p => ["loan", "mortgage", "credit_card"].includes(p.category)).map(p => [p.id, `${p.name} (${p.rate}%)`]) },
  { n: "amount", l: "Igényelt összeg (Ft)", t: "number", ph: "3000000" }], "Kérelem beadása", v => {
  const r = api("POST", "/loans/applications", v);
  if (r.status < 400) receipt("Kérelem beadva", r.data.id, [["Termék", esc(loanName(r.data.product))], ["Összeg", fmt(r.data.amount)], ["Állapot", statusBadge("submitted")]]);
  return r; }));
ACT.creditLine = () => gate("business", () => formSheet("Üzleti hitelkeret", [
  { n: "amount", l: "Igényelt keret (Ft)", t: "number", ph: "10000000" }, { n: "purpose", l: "Felhasználás célja", ph: "Forgóeszköz-finanszírozás" }], "Igénylés", v => {
  const r = api("POST", "/loans/business/credit-line", v);
  if (r.status < 400) receipt("Igénylés beadva", r.data.id, [["Keret", fmt(r.data.amount)], ["Állapot", statusBadge("submitted")]]);
  return r; }));

// --- More: profile, support, branches, conditions, settings ---
SCREENS.more = () => {
  const p = api("GET", "/profile").data;
  return { html: `<div class="card"><h2>Profil</h2><div class="row"><div class="ico">👤</div><div class="grow"><div class="t">${esc(p.name)}</div><div class="s">${esc(p.id)} · ${tierBadge(p.tier)}</div></div></div>
    ${kvList([["Születési dátum", esc(p.dob)], ["Telefon", esc(p.phone)], ["E-mail", esc(p.email)], ["Fiók", esc(p.branchName)]])}
    <div class="btns"><button class="btn alt sm" data-act="editContact">Elérhetőségek módosítása</button></div></div>
    <div class="card"><h2>Segítség</h2>
    <div class="row tap" data-act="newTicket"><div class="ico">✉️</div><div class="grow"><div class="t">Új ügy indítása</div><div class="s">Írj az ügyfélszolgálatnak</div></div>›</div>
    <div class="row tap" data-act="go" data-arg="tickets"><div class="ico">🎫</div><div class="grow"><div class="t">Ügyeim</div><div class="s">${mine(S.tickets).length} ügy</div></div>›</div>
    <div class="row tap" data-act="go" data-arg="branches"><div class="ico">📍</div><div class="grow"><div class="t">Fiókkereső és nyitvatartás</div></div>›</div>
    <div class="row tap" data-act="go" data-arg="conditions"><div class="ico">📑</div><div class="grow"><div class="t">Általános feltételek és díjak</div></div>›</div></div>
    <div class="card"><h2>Demó</h2>
    <div class="row tap" data-act="apiLog"><div class="ico">🧪</div><div class="grow"><div class="t">API-napló</div><div class="s">A hívott katalógus-végpontok</div></div>›</div>
    <div class="row tap" data-act="reset"><div class="ico">♻️</div><div class="grow"><div class="t">Demó visszaállítása</div><div class="s">Minden módosítás törlése</div></div>›</div>
    <div class="row tap" data-act="logout"><div class="ico">🚪</div><div class="grow"><div class="t">Kijelentkezés</div></div>›</div></div>` };
};
ACT.editContact = () => { const c = me();
  formSheet("Elérhetőségek", [{ n: "phone", l: "Telefonszám", v: c.phone, t: "tel" }, { n: "email", l: "E-mail", v: c.email, t: "email" }], "Mentés", v => {
    const r = api("PATCH", "/profile/contact-info", v); if (r.status < 400) { ACT.closeSheet(); toast("Elérhetőségek mentve"); } return r; }); };
ACT.newTicket = () => formSheet("Új ügy", [{ n: "subject", l: "Tárgy", ph: "pl. Számlakivonat másolat" }, { n: "message", l: "Üzenet", t: "textarea" }], "Küldés", v => {
  const r = api("POST", "/support/tickets", v);
  if (r.status < 400) receipt("Ügy rögzítve", r.data.id, [["Tárgy", esc(r.data.subject)], ["Állapot", statusBadge("open")]]); return r; });
SCREENS.tickets = () => ({ html: `<div class="card"><h2>Ügyeim</h2>${mine(S.tickets).slice().reverse().map(t => { const s = t.history[t.history.length - 1][1];
  return `<div class="row tap" data-act="ticket" data-arg="${t.id}"><div class="ico">🎫</div><div class="grow"><div class="t">${esc(t.subject)}</div><div class="s">${esc(t.id)} · ${esc(t.history[t.history.length - 1][0])}</div></div>${statusBadge(s)}</div>`; }).join("") || '<div class="empty">Nincs ügyed.</div>'}
  </div><button class="btn block" data-act="newTicket">Új ügy</button>` });
ACT.ticket = id => { const r = api("GET", `/support/tickets/${id}`); if (r.status >= 400) return toast(r.data.error);
  openSheet(r.data.subject, `<p>${statusBadge(r.data.status)} <span class="muted small">${esc(r.data.id)}</span></p><div class="timeline">${r.data.history.map(([d, s, by, m]) =>
    `<div class="ev"><b>${esc(hu(s))}</b> · ${esc(hu(by))} <span class="muted small">${esc(d)}</span><div class="small">${esc(m)}</div></div>`).join("")}</div>`); };
SCREENS.branches = () => {
  const f = NAV.f, qs = new URLSearchParams(); if (f.city) qs.set("city", f.city); if (f.postal) qs.set("postal_code", f.postal);
  const list = api("GET", `/general/branches${qs.toString() ? "?" + qs : ""}`).data, cities = [...new Set(MOCK.branches.map(b => b.city))];
  return { html: `<div class="card"><div class="filters"><label>Város<select id="b-city"><option value="">Mind</option>${cities.map(c => `<option${f.city === c ? " selected" : ""}>${c}</option>`).join("")}</select></label>
    <label>Irányítószám<input id="b-postal" value="${esc(f.postal || "")}" placeholder="1012" maxlength="4"></label><button class="btn sm" data-act="branchFilter">Keresés</button></div></div>
    <div class="card">${list.map(b => `<div class="row tap" data-act="hours" data-arg="${b.id}"><div class="ico">📍</div><div class="grow"><div class="t">${esc(b.name)}</div><div class="s">${esc(b.postal)} ${esc(b.city)}, ${esc(b.address)}</div></div>›</div>`).join("") || '<div class="empty">Nincs találat.</div>'}</div>` };
};
ACT.branchFilter = () => { NAV.f = { city: $("b-city").value, postal: $("b-postal").value.trim() }; render(); };
ACT.hours = id => {
  const r = api("GET", `/general/branches/${id}/hours`); if (r.status >= 400) return toast(r.data.error);
  const h = r.data;
  openSheet(h.branch.name, `<p class="small muted">${esc(h.branch.postal)} ${esc(h.branch.city)}, ${esc(h.branch.address)}</p>
    <div class="card" style="margin-bottom:10px"><b>Ma (${esc(h.date)}, ${esc(hu(h.day))}):</b> ${h.open === "-" ? "zárva" : `${esc(h.open)}–${esc(h.close)}`}${h.note ? ` <span class="muted small">${esc(hu(h.note))}</span>` : ""}</div>
    ${h.table.map(([d, o, c, n]) => `<div class="row"><div class="grow">${esc(hu(d))}</div><div>${o === "-" ? "zárva" : `${esc(o)}–${esc(c)}`}</div><div class="s" style="min-width:90px;text-align:right">${esc(hu(n))}</div></div>`).join("")}`);
};
SCREENS.conditions = () => {
  const all = api("GET", "/general/conditions").data, groups = {};
  all.forEach(c => (groups[c.product] ||= []).push(c));
  return { html: Object.entries(groups).map(([p, rows]) => `<div class="card"><h2>${esc(p)}</h2>${rows.map(r => `<div class="row"><div class="grow"><div class="t">${esc(r.item)}</div><div class="s">${esc(r.note)}</div></div><div class="amt">${esc(r.fee)}</div></div>`).join("")}</div>`).join("") };
};
ACT.apiLog = () => openSheet("API-napló", `<p class="small muted">Minden képernyő a katalógus végpontjait hívja. Legutóbbi hívások:</p>${API_LOG.map(l =>
  `<div class="row"><div class="grow"><div class="t"><code>${esc(l.method)} ${esc(l.url)}</code></div><div class="s">${esc(l.id)} · ${esc(l.time)}</div></div>${tierBadge(l.tier)} <span class="badge ${l.status < 400 ? "ok" : "bad"}">${l.status}</span></div>`).join("") || '<div class="empty">Még nincs hívás.</div>'}`);
ACT.reset = () => { if (!confirm("Visszaállítod az összes demóadatot?")) return; S = baseState(); save(); NAV.stack = []; NAV.tab = "home"; ACT.closeSheet(); render(); toast("Demó visszaállítva"); };

if (location.protocol === "file:") document.querySelectorAll("a[data-home]").forEach(a => { a.href = "../../../index.html"; });
render();
</script>
</body>
</html>
