<!doctype html>
<!--
  Browser chat for the bank branch officer assistant. Served, together with
  catalog.html, by src/bank_officer_web.py (uv run python src/bank_officer_web.py,
  then open http://127.0.0.1:8050/) - it needs that server's JSON/SSE API, so
  opening this file directly (file://) only shows how to start it.
  Each turn streams live over Server-Sent Events (GET /api/chats/{id}/live):
  the endpoint router's match, every coordinator tool call with its (PII-
  redacted) result, a customer switch, then the guardrail-checked reply.
  The reply arrives whole, not token by token: the PII and query-only
  guardrails act on the finished model message, so raw tokens would show
  text they later redact or rewrite.
-->
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branch Officer Chat — az architektúra kipróbálása</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #1b1f24;
    --muted: #5b6472;
    --border: #e1e4e9;
    --accent: #1a56db;
    --get: #1b7f3a;
    --post: #1a56db;
    --patch: #b4580d;
    --delete: #b42318;
    --retail: #e1e4e9;
    --retail-text: #333;
    --premium: #fde8cf;
    --premium-text: #8a4b00;
    --business: #e3d8fb;
    --business-text: #4c2a9c;
    --ok: #1b7f3a;
    --error: #b42318;
    --denied-bg: #fdecea;
    --denied-text: #8a1c12;
    --officer-bg: #1a56db;
    --officer-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --panel: #1e2125;
      --text: #e7e9ec;
      --muted: #9aa3ad;
      --border: #30343a;
      --accent: #7aa2f7;
      --retail: #30343a;
      --retail-text: #d8dadd;
      --premium: #4a3414;
      --premium-text: #f0b056;
      --business: #352a57;
      --business-text: #c9b6f5;
      --ok: #5cc77f;
      --error: #f28b82;
      --denied-bg: #3b1d1a;
      --denied-text: #f6b4ad;
      --officer-bg: #2b4fa8;
      --officer-text: #f2f5ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .app {
    max-width: 860px;
    height: 100%;
    margin: 0 auto;
    padding: 16px 16px 0;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 1.25rem; margin: 0; }
  nav { display: flex; gap: 8px; flex-wrap: wrap; }
  nav a { font-size: 0.82rem; font-weight: 600; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 99px; padding: 6px 14px; text-decoration: none; }
  nav a:hover { border-color: var(--accent); }
  .spacer { flex: 1; }
  .customer {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .customer strong { color: var(--text); }
  .tier {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 100px;
  }
  .tier.retail { background: var(--retail); color: var(--retail-text); }
  .tier.premium { background: var(--premium); color: var(--premium-text); }
  .tier.business { background: var(--business); color: var(--business-text); }
  button {
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 6px 12px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .archpick { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
  .archpick select { font: inherit; font-size: 0.85rem; max-width: 260px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty { margin: auto 0; text-align: center; color: var(--muted); }
  .empty p { margin: 0 0 12px; }
  .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .suggestions button { border-radius: 100px; font-size: 0.82rem; }

  .msg { max-width: 92%; overflow-wrap: anywhere; }
  .msg.officer {
    align-self: flex-end;
    background: var(--officer-bg);
    color: var(--officer-text);
    padding: 8px 12px;
    border-radius: 14px 14px 4px 14px;
    white-space: pre-wrap;
  }
  .msg.assistant {
    align-self: flex-start;
    width: 92%;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 14px 14px 14px 4px;
  }
  .label { font-size: 0.72rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .reply > :first-child { margin-top: 0; }
  .reply > :last-child { margin-bottom: 0; }
  .reply { line-height: 1.5; font-size: 0.93rem; }
  .reply table { border-collapse: collapse; font-size: 0.85rem; display: block; overflow-x: auto; }
  .reply th, .reply td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .reply code { font-size: 0.85em; }

  .steps { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .steps:empty { display: none; }
  .route, details.tool {
    font-size: 0.8rem;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 5px 9px;
  }
  .route { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; color: var(--muted); }
  .route.denied { background: var(--denied-bg); color: var(--denied-text); border-style: solid; }
  .method {
    font: 700 0.68rem/1 ui-monospace, monospace;
    padding: 2px 5px;
    border-radius: 4px;
    color: #fff;
  }
  .method.get { background: var(--get); }
  .method.post { background: var(--post); }
  .method.patch { background: var(--patch); }
  .method.delete { background: var(--delete); }
  .path { font: 600 0.78rem ui-monospace, monospace; color: var(--text); }
  .route.denied .path { color: inherit; }
  details.tool summary { cursor: pointer; font-family: ui-monospace, monospace; }
  details.tool .args { color: var(--muted); }
  details.tool.ok summary::before { content: "✓ "; color: var(--ok); }
  details.tool.error summary::before { content: "✗ "; color: var(--error); }
  details.tool.pending summary::before { content: "⏳ "; }
  details.tool pre {
    margin: 6px 0 2px;
    white-space: pre-wrap;
    font-size: 0.76rem;
    max-height: 220px;
    overflow-y: auto;
  }
  .status { font-size: 0.8rem; color: var(--muted); }
  .status::after { content: "…"; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  .notice { font-size: 0.85rem; padding: 6px 10px; border-radius: 6px; margin-top: 6px; }
  .notice.error { background: var(--denied-bg); color: var(--denied-text); }
  .notice.muted { color: var(--muted); padding: 0; }

  form {
    display: flex;
    gap: 8px;
    padding: 12px 0 16px;
    border-top: 1px solid var(--border);
  }
  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    font-size: 0.93rem;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    min-height: 44px;
    max-height: 160px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send { background: var(--accent); color: #fff; border-color: var(--accent); min-width: 72px; }
  #send.stop { background: var(--error); border-color: var(--error); }
  .banner {
    margin: 16px 0;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--denied-bg);
    color: var(--denied-text);
    font-size: 0.9rem;
  }
  .banner code { font-size: 0.85rem; }

  /* ---- architecture flow side panel ---- */
  .shell { display: flex; max-width: 1240px; height: 100%; margin: 0 auto; }
  .shell .app { flex: 1; min-width: 0; max-width: 860px; margin: 0; }
  aside.flow {
    width: 320px;
    flex: none;
    height: 100%;
    overflow-y: auto;
    padding: 16px 16px 16px 8px;
    border-left: 1px solid var(--border);
    margin-left: 8px;

  aside.flow .flowhead { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; margin: 0 0 6px; }
  aside.flow h2 { font-size: 0.95rem; margin: 0; align-self: flex-start; }
  aside.flow .hint { font-size: 0.74rem; color: var(--muted); margin: 0 0 12px; }
  .fnodes { display: flex; flex-direction: column; align-items: stretch; }
  .fnode {
    position: relative;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    padding: 7px 10px;
    font-size: 0.8rem;
    opacity: 0.55;
    transition: opacity .2s, border-color .2s, background .2s;
  }
  .fnode .t { font-weight: 600; display: flex; gap: 6px; align-items: baseline; }
  .fnode .k { font: 600 0.6rem/1 ui-monospace, monospace; letter-spacing: .5px; color: var(--muted); text-transform: uppercase; }
  .fnode .d { color: var(--muted); font-size: 0.74rem; margin-top: 2px; overflow-wrap: anywhere; }
  .fnode.agent { border-radius: 18px; }
  .fnode.guard { border-color: #d7263d55; background: var(--denied-bg); color: var(--denied-text); }
  .fnode.guard .d, .fnode.guard .k { color: inherit; opacity: .8; }
  .fnode.active { opacity: 1; border-color: var(--accent); animation: pulse 1.1s infinite; }
  .fnode.done { opacity: 1; border-color: var(--ok); }
  .fnode.denied { opacity: 1; border-color: var(--error); background: var(--denied-bg); color: var(--denied-text); }
  .fnode.denied .d { color: inherit; }
  .fnode.skipped { opacity: 0.3; border-style: dashed; }
  .fnode.error { opacity: 1; border-color: var(--error); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); } }
  .fnode .ms { margin-left: auto; font: 600 0.68rem/1 ui-monospace, monospace; color: var(--muted); }
  .fnode .why { margin-top: 4px; padding-left: 7px; border-left: 2px solid var(--border); color: var(--muted); font-size: 0.72rem; font-style: italic; white-space: pre-wrap; max-height: 90px; overflow-y: auto; }
  .ftotal { align-self: flex-end; margin-top: 8px; font: 600 0.72rem ui-monospace, monospace; color: var(--muted); }
  .farrow { align-self: center; width: 2px; height: 14px; background: var(--border); position: relative; }
  .farrow.on { background: var(--ok); }
  .farrow.deny { background: var(--error); }
  .fgroup { display: flex; flex-direction: column; gap: 6px; padding-left: 14px; border-left: 2px solid var(--border); margin: 0 0 0 10px; }
  .fgroup:empty { display: none; }
  #flow-toggle { display: none; }
  @media (max-width: 1000px) {
    #flow-toggle { display: inline-block; }
    aside.flow { display: none; position: fixed; right: 0; top: 0; z-index: 5; background: var(--bg); box-shadow: -8px 0 24px rgba(0,0,0,.2); }
    aside.flow.open { display: block; }
  }
</style>
</head>
<body>
<div class="shell">
<div class="app">
  <header>
    <h1>Branch Officer</h1>
    <nav><a data-home href="index.html" data-i18n="nav_home">← Kezdőlap</a> <a data-arch href="architecture.html" data-i18n="nav_arch">← Architektúra</a> <a href="catalog.html" data-i18n="nav_catalog">← Teszt katalógus</a> <a href="eval.html">Eval →</a></nav>

</div>

  var langSetting = "auto";   /* what the selector says: auto | hu | en */
  var uiLang = (navigator.language || "hu").slice(0, 2) === "hu" ? "hu" : "en";
  var langSel = document.getElementById("lang");
  var LANG_KEY = "bankOfficerLang";
  var currentCustomer = null;

  function t(key, vars) {
    var str = (I18N[uiLang] && I18N[uiLang][key]) || I18N.hu[key] || key;
    if (vars) Object.keys(vars).forEach(function (k) { str = str.replace("{" + k + "}", vars[k]); });
    return str;
  }

  function applyStaticText() {
    document.documentElement.lang = uiLang;
    document.querySelectorAll("[data-i18n]").forEach(function (n) { n.textContent = t(n.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-title]").forEach(function (n) { n.title = t(n.getAttribute("data-i18n-title")); });
    document.querySelectorAll("[data-i18n-aria]").forEach(function (n) { n.setAttribute("aria-label", t(n.getAttribute("data-i18n-aria"))); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function (n) { n.placeholder = t(n.getAttribute("data-i18n-placeholder")); });
    sendBtn.textContent = streaming ? t("stop") : t("send");
    var auto = langSel.querySelector("option[value=auto]");
    if (auto) auto.textContent = t("lang_auto");
    setCustomer(currentCustomer);
    if (typeof fillArchitectures === "function" && archList.length) fillArchitectures(archSel.value);
    var empty = messagesEl.querySelector(".empty");
    if (empty) { empty.remove(); showEmpty(); }
  }

  /* In auto mode the UI follows the language of the latest turn. */
  function noteTurnLanguage(code) {
    if (langSetting === "auto" && (code === "hu" || code === "en") && code !== uiLang) {
      uiLang = code;
      applyStaticText();
    }
  }

  function setLangSetting(value) {
    langSetting = value;
    langSel.value = value;
    try { localStorage.setItem(LANG_KEY, value); } catch (e) { /* ignore */ }
    if (value === "hu" || value === "en") { uiLang = value; applyStaticText(); }
  }


  var chatId = null;
  var streaming = false;
  var source = null;

  if (location.protocol === "file:") {
    var banner = document.createElement("div");
    banner.className = "banner";
    banner.innerHTML = t("server_needed") +
      "<code>uv run python src/bank_officer/main.py</code>" + t("then_open") +
      "<a href=\"http://127.0.0.1:8050/chat.html\">http://127.0.0.1:8050/chat.html</a>.";
    messagesEl.appendChild(banner);
    form.hidden = true;
    newChatBtn.hidden = true;
    document.getElementById("flow").hidden = true;
    return;
  }

  function storageGet() { try { return sessionStorage.getItem(STORAGE_KEY); } catch (e) { return null; } }
  function storageSet(v) { try { if (v) sessionStorage.setItem(STORAGE_KEY, v); else sessionStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ } }

  function api(path, opts) {
    opts = opts || {};
    if (opts.json !== undefined) {
      opts.body = JSON.stringify(opts.json);
      opts.headers = { "Content-Type": "application/json" };
      delete opts.json;
    }
    return fetch(path, opts).then(function (res) {
      if (res.status === 204) return null;
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) {
          var err = new Error((body && body.detail) || res.statusText);
          err.status = res.status;
          throw err;
        }
        return body;
      });
    });
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function renderMarkdown(target, text) {
    target.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
    target.querySelectorAll("a").forEach(function (a) { a.target = "_blank"; a.rel = "noopener noreferrer"; });
  }

  /* ---- Architecture flow panel: one run of the pipeline, rebuilt per question ---- */
  var flowEl = document.getElementById("fnodes");
  function toolLabel(name) { var k = "t_" + name; return I18N.hu[k] ? t(k) : name; }

  function Flow() { this.reset(); }

  Flow.prototype.node = function (kind, title, tag, desc) {
    var n = el("div", "fnode " + kind);
    var t = el("div", "t");
    t.appendChild(document.createTextNode(title));
    t.appendChild(el("span", "k", tag));
    n.appendChild(t);
    var d = el("div", "d", desc || "");
    n.appendChild(d);
    n.d = d;
    return n;
  };

  function fmtMs(ms) { return ms >= 1000 ? (ms / 1000).toFixed(1) + " s" : Math.round(ms) + " ms"; }

  Flow.prototype.time = function (n, ms) {
    if (ms === undefined || ms === null) return;
    var t = n.querySelector(".t"), m = n.querySelector(".ms");
    if (!m) { m = el("span", "ms"); t.appendChild(m); }
    m.textContent = fmtMs(ms);
  };

  Flow.prototype.why = function (n, text) {
    if (!text) return;
    var w = n.querySelector(".why");
    if (!w) { w = el("div", "why"); n.appendChild(w); }
    w.textContent = text;
  };

  Flow.prototype.state = function (n, cls, desc) {
    ["active", "done", "denied", "skipped", "error"].forEach(function (c) { n.classList.remove(c); });
    if (cls) n.classList.add(cls);
    if (desc !== undefined) n.d.textContent = desc;
  };

  Flow.prototype.arrow = function () {
    var a = el("div", "farrow");
    flowEl.appendChild(a);
    return a;
  };

  Flow.prototype.reset = function () {
    flowEl.textContent = "";
    this.tools = {};
    var n = this.n = {};
    n.q = this.node("human", t("f_question"), t("f_input"), "");
    n.gin = this.node("guard", t("f_gin"), t("f_code"), t("f_gin_d"));
    n.router = this.node("agent", "Endpoint router", "Jev", t("f_router_d"));
    n.access = this.node("guard", t("f_access"), t("f_code"), t("f_access_d"));
    n.coord = this.node("agent", t("f_coord"), "LLM", "");
    this.group = el("div", "fgroup");
    n.gout = this.node("guard", t("f_gout"), t("f_code"), t("f_gout_d"));
    n.gw = this.node("tool", t("f_gw"), t("f_code"), "");
    var self = this;
    this.arrows = [];
    [n.q, n.gin, n.router, n.access, n.coord, this.group, n.gout, n.gw].forEach(function (node, i) {
      if (i) self.arrows.push(self.arrow());
      flowEl.appendChild(node);
    });
    [n.gin, n.router, n.access, n.coord, n.gout, n.gw].forEach(function (node) { node.classList.add("idle"); });
    this.state(n.q, null);
    this.noRouter();
  };

  /* An architecture without a router step shows its two nodes as not present. */
  Flow.prototype.noRouter = function () {
    if (currentArch.router) return;
    this.state(this.n.router, "skipped", t("f_no_router"));
    this.state(this.n.access, "skipped", t("f_tools_enforce"));
  };

  Flow.prototype.start = function (text) {
    this.reset();
    this.state(this.n.q, "done", text.length > 70 ? text.slice(0, 70) + "…" : text);
    this.state(this.n.gin, "done");
    if (currentArch.router) this.state(this.n.router, "active");
    this.arrows[0].classList.add("on");
    this.arrows[1].classList.add("on");
  };

  Flow.prototype.handle = function (event, data) {
    var n = this.n, self = this;
    if (event === "route" && data.skipped) {
      this.lastAt = data.at_ms || 0;
      this.llmTotal = 0;
      this.arrows[2].classList.add("on");
      this.arrows[3].classList.add("on");
      this.state(n.coord, "active", currentArch.mode === "flat" ? t("f_flat") : t("f_pick"));
    } else if (event === "route") {
      var ep = data.endpoint;
      this.time(n.router, data.elapsed_ms);
      this.lastAt = data.at_ms || 0;
      this.llmTotal = 0;
      this.state(n.router, "done", ep ? ep.method + " " + ep.path + " · p=" + Number(ep.probability).toFixed(2) : t("f_no_match"));
      this.arrows[2].classList.add("on");
      if (ep && ep.access_denied === true) {
        this.state(n.access, "denied", t("f_denied", { tier: ep.required_entitlement }));
        this.arrows[3].classList.add("deny");
        this.state(n.coord, "skipped", t("f_not_run"));
        this.state(n.gout, "skipped");
        this.group.hidden = true;
        this.arrows[4].hidden = this.arrows[5].hidden = true;
        this.state(n.gw, "active", t("f_fixed_deny"));
      } else {
        this.state(n.access, "done", ep ? t("f_allowed", { tier: ep.required_entitlement }) : t("f_allowed_none"));
        this.arrows[3].classList.add("on");
        this.state(n.coord, "active", t("f_pick"));
      }
    } else if (event === "tool_call") {
      var node = this.node("agent", toolLabel(data.name), data.name.indexOf("ask_") === 0 ? "subagent" : "tool", "");
      var args = JSON.stringify(data.args || {});
      node.d.textContent = args === "{}" ? t("f_running") : args.slice(0, 90);
      this.state(node, "active");
      node.callAt = data.at_ms;
      this.llmTotal = (this.llmTotal || 0) + (data.llm_ms || 0);
      this.time(n.coord, this.llmTotal);
      if (data.reason) this.why(n.coord, data.reason);
      this.group.appendChild(node);
      this.tools[data.id] = node;
      this.arrows[4].classList.add("on");
    } else if (event === "tool_result") {
      var tn = this.tools[data.id];
      if (tn) {
        this.state(tn, data.ok ? "done" : "error");
        if (tn.callAt !== undefined && data.at_ms !== undefined) this.time(tn, data.at_ms - tn.callAt);
      }
      if (n.coord.classList.contains("active")) n.coord.d.textContent = t("f_answering");
    } else if (event === "customer") {
      n.coord.d.textContent = t("f_customer") + (data.customer ? data.customer.name : "-");
    } else if (event === "reply") {
      Object.keys(this.tools).forEach(function (id) {
        if (self.tools[id].classList.contains("active")) self.state(self.tools[id], "done");
      });
      if (!n.coord.classList.contains("skipped")) {
        this.llmTotal = (this.llmTotal || 0) + (data.llm_ms || 0);
        this.time(n.coord, this.llmTotal);
        if (data.reason) this.why(n.coord, data.reason);
        this.state(n.coord, "done");
        this.state(n.gout, "done");
        this.arrows[5].classList.add("on");
        this.state(n.gw, "done", t("f_delivered"));
      } else {
        this.state(n.gw, "done", t("f_deny_delivered"));
      }
      this.arrows[6].classList.add("on");
      if (data.total_ms !== undefined) {
        this.time(n.gw, data.total_ms);
        flowEl.appendChild(el("div", "ftotal", t("f_total") + fmtMs(data.total_ms)));
      }
    } else if (event === "app_error" || event === "stopped") {
      ["router", "access", "coord", "gout", "gw"].forEach(function (k) {
        if (n[k].classList.contains("active")) self.state(n[k], "error", event === "stopped" ? t("f_stopped") : t("f_error"));
      });
      Object.keys(this.tools).forEach(function (id) {
        if (self.tools[id].classList.contains("active")) self.state(self.tools[id], "error");
      });
    }
  };

  /* ---- Architecture profiles: picker ---- */
  var archSel = document.getElementById("arch");
  var currentArch = { id: null, router: true, mode: "delegate" };

  function loadProfile(id) {
    return api("/api/architectures/" + encodeURIComponent(id)).then(function (p) {
      currentArch = { id: p.id, router: !!(p.router && p.router.enabled), mode: p.coordinator.mode };
      return p;
    });
  }

  var archList = [];
  function archText(a, key) { return (uiLang === "en" && a[key + "_en"]) || a[key]; }

  /* Fill the picker in the UI language; keeps the selected profile. */
  function fillArchitectures(selected) {
    archSel.textContent = "";
    archList.forEach(function (a) {
      var o = el("option", null, archText(a, "label") + (a.error ? " " + t("invalid") : ""));
      o.value = a.id;
      o.disabled = !!a.error;
      o.title = a.error || archText(a, "description") || "";
      archSel.appendChild(o);
    });
    archSel.value = selected;
    if (archSel.value !== selected) archSel.selectedIndex = 0;
  }

  function loadArchitectures() {
    return api("/api/architectures").then(function (body) {
      archList = body.architectures;
      fillArchitectures(body.default);
      return body;
    });
  }

  function endChatThenNew() {
    var done = chatId ? api("/api/chats/" + encodeURIComponent(chatId), { method: "DELETE" }).catch(function () {}) : Promise.resolve();
    return done.then(function () { return loadProfile(archSel.value); }).then(startNewChat);
  }

  archSel.addEventListener("change", function () {
    if (streaming) { archSel.value = currentArch.id; return; }
    endChatThenNew().catch(function (err) { alert(err.message); archSel.value = currentArch.id; });
  });

  var flow = new Flow();
  var flowPanel = document.getElementById("flow");
  document.getElementById("flow-toggle").addEventListener("click", function () { flowPanel.classList.toggle("open"); });

  function setCustomer(c) {
    currentCustomer = c;
    customerEl.textContent = "";
    if (!c) { customerEl.textContent = t("no_customer"); return; }
    customerEl.appendChild(document.createTextNode(t("customer")));
    customerEl.appendChild(el("strong", null, c.name));
    customerEl.appendChild(el("span", "tier " + c.tier, c.tier));
  }

  function showEmpty() {
    var box = el("div", "empty");
    box.appendChild(el("p", null, t("empty")));
    var list = el("div", "suggestions");
    SUGGESTIONS_BY_LANG[uiLang].forEach(function (s) {
      var b = el("button", null, s);
      b.type = "button";
      b.onclick = function () { input.value = s; send(); };
      list.appendChild(b);
    });
    box.appendChild(list);
    messagesEl.appendChild(box);
  }

  function clearEmpty() {
    var empty = messagesEl.querySelector(".empty");
    if (empty) empty.remove();
  }

  function addOfficer(text) {
    clearEmpty();
    var bubble = el("div", "msg officer", text);
    messagesEl.appendChild(bubble);
  }

  /* One assistant bubble whose content is driven by turn events, both live
   * (SSE) and replayed from history - so both render identically. */
  function AssistantBubble() {
    this.root = el("div", "msg assistant");
    this.root.appendChild(el("div", "label", t("assistant")));
    this.steps = el("div", "steps");
    this.reply = el("div", "reply");
    this.status = el("div", "status", t("s_routing"));
    this.root.appendChild(this.steps);
    this.root.appendChild(this.reply);
    this.root.appendChild(this.status);
    this.tools = {};
    messagesEl.appendChild(this.root);
  }

  AssistantBubble.prototype.handle = function (event, data) {
    var self = this;
    flow.handle(event, data);
    if (event === "route") {
      noteTurnLanguage(data.language);
      var ep = data.endpoint;
      var row = el("div", "route");
      if (!ep) {
        row.textContent = t("r_none");
      } else {
        if (ep.access_denied === true) row.classList.add("denied");
        row.appendChild(el("span", "method " + ep.method.toLowerCase(), ep.method));
        row.appendChild(el("span", "path", ep.path));
        row.appendChild(el("span", null, "· " + ep.menu_path + " · p=" + Number(ep.probability).toFixed(2)));
        if (ep.access_denied === true) row.appendChild(el("strong", null, t("r_denied", { tier: ep.required_entitlement })));
      }
      this.steps.appendChild(row);
      this.status.textContent = t("s_coord");
    } else if (event === "tool_call") {
      var chip = el("details", "tool pending");
      var summary = el("summary");
      summary.appendChild(document.createTextNode(data.name));
      var args = JSON.stringify(data.args || {});
      if (args !== "{}") summary.appendChild(el("span", "args", " " + args));
      chip.appendChild(summary);
      this.steps.appendChild(chip);
      this.tools[data.id] = chip;
      this.status.textContent = data.name.indexOf("ask_") === 0 ? t("s_waiting") + toolLabel(data.name) : t("s_running") + data.name;
    } else if (event === "tool_result") {
      var entry = this.tools[data.id];
      if (entry) {
        entry.classList.remove("pending");
        entry.classList.add(data.ok ? "ok" : "error");
        if (data.preview) entry.appendChild(el("pre", null, data.preview));
      }
      this.status.textContent = t("s_writing");
    } else if (event === "customer") {
      setCustomer(data.customer);
    } else if (event === "reply") {
      renderMarkdown(this.reply, data.text);
      noteTurnLanguage(data.language);
    } else if (event === "app_error") {
      this.root.appendChild(el("div", "notice error", data.message));
    } else if (event === "stopped") {
      this.root.appendChild(el("div", "notice muted", t("stopped")));
    }
    scrollDown();
    return self;
  };

  AssistantBubble.prototype.finish = function () {
    this.status.remove();
    if (!this.reply.textContent && !this.root.querySelector(".notice")) {
      this.root.appendChild(el("div", "notice muted", t("no_reply")));
    }
  };

  function setStreaming(on) {
    streaming = on;
    sendBtn.textContent = on ? t("stop") : t("send");
    sendBtn.classList.toggle("stop", on);
    sendBtn.disabled = false;
    newChatBtn.disabled = on;
  }

  function follow(bubble) {
    setStreaming(true);
    source = new EventSource("/api/chats/" + encodeURIComponent(chatId) + "/live");
    var gotEvent = false;
    ["route", "tool_call", "tool_result", "customer", "reply", "app_error", "stopped"].forEach(function (name) {
      source.addEventListener(name, function (ev) { gotEvent = true; bubble.handle(name, JSON.parse(ev.data)); });
    });
    function end() {
      if (!source) return;
      source.close();
      source = null;
      bubble.finish();
      setStreaming(false);
      input.focus();
    }
    source.addEventListener("done", function () {
      if (gotEvent) { end(); return; }
      /* The turn ended before the stream attached (e.g. an instant access
       * refusal), so nothing was replayed: take it from the saved history. */
      api("/api/chats/" + encodeURIComponent(chatId)).then(function (body) {
        var last = body.turns[body.turns.length - 1];
        if (last) last.events.forEach(function (pair) { bubble.handle(pair[0], pair[1]); });
      }).catch(function () { /* fall through to "Nincs válasz." */ }).finally(end);
    });
    source.onerror = function () {
      /* Connection dropped: reconnecting would replay the run from its
       * start, so reload the session state instead. */
      end();
      bubble.root.appendChild(el("div", "notice error", t("lost")));
    };
  }

  function send() {
    var text = input.value.trim();
    if (!text || streaming || !chatId) return;
    input.value = "";
    autosize();
    addOfficer(text);
    flow.start(text);
    var bubble = new AssistantBubble();
    scrollDown();
    sendBtn.disabled = true;
    api("/api/chats/" + encodeURIComponent(chatId) + "/messages", { method: "POST", json: { content: text } })
      .then(function () { follow(bubble); })
      .catch(function (err) {
        bubble.handle("app_error", { message: err.status === 404 ? t("session_over") : err.message });
        bubble.finish();
        setStreaming(false);
      });
  }

  function stop() {
    sendBtn.disabled = true;
    api("/api/chats/" + encodeURIComponent(chatId) + "/cancel", { method: "POST" }).catch(function () { /* already finished */ });
  }

  function startNewChat() {
    return api("/api/chats", { method: "POST", json: { architecture: archSel.value, language: langSetting } }).then(function (body) {
      chatId = body.chat_id;
      storageSet(chatId);
      messagesEl.textContent = "";
      flow.reset();
      setCustomer(null);
      showEmpty();
    });
  }

  function restore(id) {
    return api("/api/chats/" + encodeURIComponent(id)).then(function (body) {
      chatId = id;
      archSel.value = body.architecture;
      if (body.language === "hu" || body.language === "en") setLangSetting(body.language);
      else api("/api/chats/" + encodeURIComponent(id) + "/language", { method: "PUT", json: { language: langSetting } }).catch(function () { /* ignore */ });
      return loadProfile(body.architecture).then(function () { return body; });
    }).then(function (body) {
      messagesEl.textContent = "";
      setCustomer(body.customer);
      flow.reset();
      body.turns.forEach(function (turn, i) {
        addOfficer(turn.prompt);
        flow.start(turn.prompt);  /* each turn rebuilds the flow; the last one stays */
        var bubble = new AssistantBubble();
        turn.events.forEach(function (pair) { bubble.handle(pair[0], pair[1]); });
        bubble.finish();
      });
      if (body.live) {
        addOfficer(body.live.prompt);
        flow.start(body.live.prompt);
        follow(new AssistantBubble());
      } else if (!body.turns.length) {
        showEmpty();
      }
      scrollDown();
    });
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (streaming) stop(); else send();
  });
  input.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
      ev.preventDefault();
      if (!streaming) send();
    }
  });
  input.addEventListener("input", autosize);

  newChatBtn.addEventListener("click", function () {
    if (streaming || !chatId) return;
    newChatBtn.disabled = true;
    api("/api/chats/" + encodeURIComponent(chatId), { method: "DELETE" })
      .catch(function () { /* already gone */ })
      .then(startNewChat)
      .finally(function () { newChatBtn.disabled = false; input.focus(); });
  });

  function loadLanguages() {
    var fallback = { languages: [{ id: "en", label: "English" }, { id: "hu", label: "Magyar" }] };
    return api("/api/languages").catch(function () { return fallback; }).then(function (body) {
      langSel.textContent = "";
      body.languages.forEach(function (l) {
        if (l.id === "auto") return;  /* the selector offers explicit languages only */
        var o = el("option", null, l.label);
        o.value = l.id;
        langSel.appendChild(o);
      });
      var stored = null;
      try { stored = localStorage.getItem(LANG_KEY); } catch (e) { /* ignore */ }
      setLangSetting(stored === "hu" || stored === "en" ? stored : uiLang);  /* first visit: browser language */
    });
  }

  langSel.addEventListener("change", function () {
    setLangSetting(langSel.value);
    if (chatId) api("/api/chats/" + encodeURIComponent(chatId) + "/language", { method: "PUT", json: { language: langSel.value } }).catch(function () { /* chat ended */ });
  });

  var saved = storageGet();
  applyStaticText();
  loadLanguages().then(loadArchitectures).then(function () {
    return saved ? restore(saved).catch(function () { return loadProfile(archSel.value).then(startNewChat); })
                 : loadProfile(archSel.value).then(startNewChat);
  }).catch(function (err) {
    messagesEl.textContent = "";
    var b = el("div", "banner", t("server_down") + err.message);
    messagesEl.appendChild(b);
  });
})();
