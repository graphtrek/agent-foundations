id: router
label: Router + koordinátor + specialisták + összeállító
description: A bank-officer-agent-architecture-hu.html szerinti felépítés. Jev endpoint router, koordinátor (Luna), három domain specialista (párhuzamosan hívhatók), nyilvános infó subagent és válasz-összeállító subagent.
label_en: Router + coordinator + specialists + synthesizer
description_en: The structure from bank-officer-agent-architecture-en.html. Jev endpoint router, coordinator (Luna), three domain specialists (callable in parallel), a public-info subagent and an answer-synthesizer subagent.
router:
  enabled: true
  agent: endpoint_router
coordinator:
  agent: branch_coordinator
  mode: delegate
  specialists:
  - id: account_specialist
    tool_group: account
    description: Ask the account/transactions specialist about the selected customer's balances,
      transaction history, statements, spending totals or scheduled payments.
  - id: product_specialist
    tool_group: product
    description: Ask the product/offers specialist about the catalog or the selected customer's
      personalized discounts and existing loans.
  - id: service_specialist
    tool_group: service
    description: Ask the customer-service specialist about the selected customer's cards and card
      limits, loan-application status, profile/contact data or support tickets.
  - id: public_info_specialist
    tool_group: public
    description: Ask the public-information specialist about anything that is the same for every
      customer - branch opening hours, branch locations/addresses, standard fees and general
      conditions. Needs no selected customer.
  synthesizer: answer_synthesizer
