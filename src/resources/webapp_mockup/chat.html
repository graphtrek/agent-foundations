<!doctype html>
<!--
  Browser chat for the bank branch officer assistant. Served, together with
  catalog.html, by src/bank_officer_web.py (uv run python src/bank_officer_web.py,
  then open http://127.0.0.1:8010/) - it needs that server's JSON/SSE API, so
  opening this file directly (file://) only shows how to start it.
  Each turn streams live over Server-Sent Events (GET /api/chats/{id}/live):
  the endpoint router's match, every coordinator tool call with its (PII-
  redacted) result, a customer switch, then the guardrail-checked reply.
  The reply arrives whole, not token by token: the PII and query-only
  guardrails act on the finished model message, so raw tokens would show
  text they later redact or rewrite.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branch Officer Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #1b1f24;
    --muted: #5b6472;
    --border: #e1e4e9;
    --accent: #1a56db;
    --get: #1b7f3a;
    --post: #1a56db;
    --patch: #b4580d;
    --delete: #b42318;
    --retail: #e1e4e9;
    --retail-text: #333;
    --premium: #fde8cf;
    --premium-text: #8a4b00;
    --business: #e3d8fb;
    --business-text: #4c2a9c;
    --ok: #1b7f3a;
    --error: #b42318;
    --denied-bg: #fdecea;
    --denied-text: #8a1c12;
    --officer-bg: #1a56db;
    --officer-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --panel: #1e2125;
      --text: #e7e9ec;
      --muted: #9aa3ad;
      --border: #30343a;
      --accent: #7aa2f7;
      --retail: #30343a;
      --retail-text: #d8dadd;
      --premium: #4a3414;
      --premium-text: #f0b056;
      --business: #352a57;
      --business-text: #c9b6f5;
      --ok: #5cc77f;
      --error: #f28b82;
      --denied-bg: #3b1d1a;
      --denied-text: #f6b4ad;
      --officer-bg: #2b4fa8;
      --officer-text: #f2f5ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .app {
    max-width: 860px;
    height: 100%;
    margin: 0 auto;
    padding: 16px 16px 0;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 1.25rem; margin: 0; }
  nav a { color: var(--accent); font-size: 0.88rem; text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  .spacer { flex: 1; }
  .customer {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .customer strong { color: var(--text); }
  .tier {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 100px;
  }
  .tier.retail { background: var(--retail); color: var(--retail-text); }
  .tier.premium { background: var(--premium); color: var(--premium-text); }
  .tier.business { background: var(--business); color: var(--business-text); }
  button {
    font: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 6px 12px;
  }
  button:disabled { opacity: 0.5; cursor: default; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty { margin: auto 0; text-align: center; color: var(--muted); }
  .empty p { margin: 0 0 12px; }
  .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .suggestions button { border-radius: 100px; font-size: 0.82rem; }

  .msg { max-width: 92%; overflow-wrap: anywhere; }
  .msg.officer {
    align-self: flex-end;
    background: var(--officer-bg);
    color: var(--officer-text);
    padding: 8px 12px;
    border-radius: 14px 14px 4px 14px;
    white-space: pre-wrap;
  }
  .msg.assistant {
    align-self: flex-start;
    width: 92%;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 14px 14px 14px 4px;
  }
  .label { font-size: 0.72rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .reply > :first-child { margin-top: 0; }
  .reply > :last-child { margin-bottom: 0; }
  .reply { line-height: 1.5; font-size: 0.93rem; }
  .reply table { border-collapse: collapse; font-size: 0.85rem; display: block; overflow-x: auto; }
  .reply th, .reply td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .reply code { font-size: 0.85em; }

  .steps { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .steps:empty { display: none; }
  .route, details.tool {
    font-size: 0.8rem;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 5px 9px;
  }
  .route { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; color: var(--muted); }
  .route.denied { background: var(--denied-bg); color: var(--denied-text); border-style: solid; }
  .method {
    font: 700 0.68rem/1 ui-monospace, monospace;
    padding: 2px 5px;
    border-radius: 4px;
    color: #fff;
  }
  .method.get { background: var(--get); }
  .method.post { background: var(--post); }
  .method.patch { background: var(--patch); }
  .method.delete { background: var(--delete); }
  .path { font: 600 0.78rem ui-monospace, monospace; color: var(--text); }
  .route.denied .path { color: inherit; }
  details.tool summary { cursor: pointer; font-family: ui-monospace, monospace; }
  details.tool .args { color: var(--muted); }
  details.tool.ok summary::before { content: "✓ "; color: var(--ok); }
  details.tool.error summary::before { content: "✗ "; color: var(--error); }
  details.tool.pending summary::before { content: "⏳ "; }
  details.tool pre {
    margin: 6px 0 2px;
    white-space: pre-wrap;
    font-size: 0.76rem;
    max-height: 220px;
    overflow-y: auto;
  }
  .status { font-size: 0.8rem; color: var(--muted); }
  .status::after { content: "…"; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  .notice { font-size: 0.85rem; padding: 6px 10px; border-radius: 6px; margin-top: 6px; }
  .notice.error { background: var(--denied-bg); color: var(--denied-text); }
  .notice.muted { color: var(--muted); padding: 0; }

  form {
    display: flex;
    gap: 8px;
    padding: 12px 0 16px;
    border-top: 1px solid var(--border);
  }
  textarea {
    flex: 1;
    resize: none;
    font: inherit;
    font-size: 0.93rem;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    min-height: 44px;
    max-height: 160px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send { background: var(--accent); color: #fff; border-color: var(--accent); min-width: 72px; }
  #send.stop { background: var(--error); border-color: var(--error); }
  .banner {
    margin: 16px 0;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--denied-bg);
    color: var(--denied-text);
    font-size: 0.9rem;
  }
  .banner code { font-size: 0.85rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Branch Officer Assistant</h1>
    <nav><a href="catalog.html">Endpoint catalog →</a></nav>
    <span class="spacer"></span>
    <span class="customer" id="customer">No customer selected</span>
    <button type="button" id="new-chat" title="End this session (saves it to conversations/) and start a new one">New chat</button>
  </header>

  <div id="messages" aria-live="polite"></div>

  <form id="composer">
    <textarea id="input" rows="1" maxlength="2000" placeholder="Ask about a customer's accounts, transactions, products or offers…" required></textarea>
    <button type="submit" id="send">Send</button>
  </form>
</div>

<script>
(function () {
  "use strict";

  var messagesEl = document.getElementById("messages");
  var form = document.getElementById("composer");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var newChatBtn = document.getElementById("new-chat");
  var customerEl = document.getElementById("customer");
  var STORAGE_KEY = "bankOfficerChatId";
  var SUGGESTIONS = [
    "List the customers in this branch session",
    "Select Nagy Katalin and show the account balances",
    "What personalized offers does the customer have?",
    "Show transactions over 100 000 HUF since September"
  ];

  var chatId = null;
  var streaming = false;
  var source = null;

  if (location.protocol === "file:") {
    var banner = document.createElement("div");
    banner.className = "banner";
    banner.innerHTML = "This page needs the chat server. Start it with " +
      "<code>uv run python src/bank_officer_web.py</code> and open " +
      "<a href=\"http://127.0.0.1:8010/chat.html\">http://127.0.0.1:8010/chat.html</a>.";
    messagesEl.appendChild(banner);
    form.hidden = true;
    newChatBtn.hidden = true;
    return;
  }

  function storageGet() { try { return sessionStorage.getItem(STORAGE_KEY); } catch (e) { return null; } }
  function storageSet(v) { try { if (v) sessionStorage.setItem(STORAGE_KEY, v); else sessionStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ } }

  function api(path, opts) {
    opts = opts || {};
    if (opts.json !== undefined) {
      opts.body = JSON.stringify(opts.json);
      opts.headers = { "Content-Type": "application/json" };
      delete opts.json;
    }
    return fetch(path, opts).then(function (res) {
      if (res.status === 204) return null;
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) {
          var err = new Error((body && body.detail) || res.statusText);
          err.status = res.status;
          throw err;
        }
        return body;
      });
    });
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  function renderMarkdown(target, text) {
    target.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
    target.querySelectorAll("a").forEach(function (a) { a.target = "_blank"; a.rel = "noopener noreferrer"; });
  }

  function setCustomer(c) {
    customerEl.textContent = "";
    if (!c) { customerEl.textContent = "No customer selected"; return; }
    customerEl.appendChild(document.createTextNode("Customer: "));
    customerEl.appendChild(el("strong", null, c.name));
    customerEl.appendChild(el("span", "tier " + c.tier, c.tier));
  }

  function showEmpty() {
    var box = el("div", "empty");
    box.appendChild(el("p", null, "Ask about the customer at the desk. Replies are query-only and pass through the guardrails."));
    var list = el("div", "suggestions");
    SUGGESTIONS.forEach(function (s) {
      var b = el("button", null, s);
      b.type = "button";
      b.onclick = function () { input.value = s; send(); };
      list.appendChild(b);
    });
    box.appendChild(list);
    messagesEl.appendChild(box);
  }

  function clearEmpty() {
    var empty = messagesEl.querySelector(".empty");
    if (empty) empty.remove();
  }

  function addOfficer(text) {
    clearEmpty();
    var bubble = el("div", "msg officer", text);
    messagesEl.appendChild(bubble);
  }

  /* One assistant bubble whose content is driven by turn events, both live
   * (SSE) and replayed from history - so both render identically. */
  function AssistantBubble() {
    this.root = el("div", "msg assistant");
    this.root.appendChild(el("div", "label", "Assistant"));
    this.steps = el("div", "steps");
    this.reply = el("div", "reply");
    this.status = el("div", "status", "Routing the question");
    this.root.appendChild(this.steps);
    this.root.appendChild(this.reply);
    this.root.appendChild(this.status);
    this.tools = {};
    messagesEl.appendChild(this.root);
  }

  AssistantBubble.prototype.handle = function (event, data) {
    var self = this;
    if (event === "route") {
      var ep = data.endpoint;
      var row = el("div", "route");
      if (!ep) {
        row.textContent = "Endpoint router: no confident match";
      } else {
        if (ep.access_denied === true) row.classList.add("denied");
        row.appendChild(el("span", "method " + ep.method.toLowerCase(), ep.method));
        row.appendChild(el("span", "path", ep.path));
        row.appendChild(el("span", null, "· " + ep.menu_path + " · p=" + Number(ep.probability).toFixed(2)));
        if (ep.access_denied === true) row.appendChild(el("strong", null, "· access denied (" + ep.required_entitlement + " required)"));
      }
      this.steps.appendChild(row);
      this.status.textContent = "Asking the coordinator";
    } else if (event === "tool_call") {
      var chip = el("details", "tool pending");
      var summary = el("summary");
      summary.appendChild(document.createTextNode(data.name));
      var args = JSON.stringify(data.args || {});
      if (args !== "{}") summary.appendChild(el("span", "args", " " + args));
      chip.appendChild(summary);
      this.steps.appendChild(chip);
      this.tools[data.id] = chip;
      this.status.textContent = data.name.indexOf("ask_") === 0 ? "Waiting for the " + data.name.replace(/^ask_|_specialist$/g, "") + " specialist" : "Running " + data.name;
    } else if (event === "tool_result") {
      var entry = this.tools[data.id];
      if (entry) {
        entry.classList.remove("pending");
        entry.classList.add(data.ok ? "ok" : "error");
        if (data.preview) entry.appendChild(el("pre", null, data.preview));
      }
      this.status.textContent = "Writing the answer";
    } else if (event === "customer") {
      setCustomer(data.customer);
    } else if (event === "reply") {
      renderMarkdown(this.reply, data.text);
    } else if (event === "app_error") {
      this.root.appendChild(el("div", "notice error", data.message));
    } else if (event === "stopped") {
      this.root.appendChild(el("div", "notice muted", "Stopped."));
    }
    scrollDown();
    return self;
  };

  AssistantBubble.prototype.finish = function () {
    this.status.remove();
    if (!this.reply.textContent && !this.root.querySelector(".notice")) {
      this.root.appendChild(el("div", "notice muted", "No reply."));
    }
  };

  function setStreaming(on) {
    streaming = on;
    sendBtn.textContent = on ? "Stop" : "Send";
    sendBtn.classList.toggle("stop", on);
    sendBtn.disabled = false;
    newChatBtn.disabled = on;
  }

  function follow(bubble) {
    setStreaming(true);
    source = new EventSource("/api/chats/" + encodeURIComponent(chatId) + "/live");
    var gotEvent = false;
    ["route", "tool_call", "tool_result", "customer", "reply", "app_error", "stopped"].forEach(function (name) {
      source.addEventListener(name, function (ev) { gotEvent = true; bubble.handle(name, JSON.parse(ev.data)); });
    });
    function end() {
      if (!source) return;
      source.close();
      source = null;
      bubble.finish();
      setStreaming(false);
      input.focus();
    }
    source.addEventListener("done", function () {
      if (gotEvent) { end(); return; }
      /* The turn ended before the stream attached (e.g. an instant access
       * refusal), so nothing was replayed: take it from the saved history. */
      api("/api/chats/" + encodeURIComponent(chatId)).then(function (body) {
        var last = body.turns[body.turns.length - 1];
        if (last) last.events.forEach(function (pair) { bubble.handle(pair[0], pair[1]); });
      }).catch(function () { /* fall through to "No reply." */ }).finally(end);
    });
    source.onerror = function () {
      /* Connection dropped: reconnecting would replay the run from its
       * start, so reload the session state instead. */
      end();
      bubble.root.appendChild(el("div", "notice error", "Lost the connection to the chat server."));
    };
  }

  function send() {
    var text = input.value.trim();
    if (!text || streaming || !chatId) return;
    input.value = "";
    autosize();
    addOfficer(text);
    var bubble = new AssistantBubble();
    scrollDown();
    sendBtn.disabled = true;
    api("/api/chats/" + encodeURIComponent(chatId) + "/messages", { method: "POST", json: { content: text } })
      .then(function () { follow(bubble); })
      .catch(function (err) {
        bubble.handle("app_error", { message: err.status === 404 ? "This session has ended - start a new chat." : err.message });
        bubble.finish();
        setStreaming(false);
      });
  }

  function stop() {
    sendBtn.disabled = true;
    api("/api/chats/" + encodeURIComponent(chatId) + "/cancel", { method: "POST" }).catch(function () { /* already finished */ });
  }

  function startNewChat() {
    return api("/api/chats", { method: "POST" }).then(function (body) {
      chatId = body.chat_id;
      storageSet(chatId);
      messagesEl.textContent = "";
      setCustomer(null);
      showEmpty();
    });
  }

  function restore(id) {
    return api("/api/chats/" + encodeURIComponent(id)).then(function (body) {
      chatId = id;
      messagesEl.textContent = "";
      setCustomer(body.customer);
      body.turns.forEach(function (turn) {
        addOfficer(turn.prompt);
        var bubble = new AssistantBubble();
        turn.events.forEach(function (pair) { bubble.handle(pair[0], pair[1]); });
        bubble.finish();
      });
      if (body.live) {
        addOfficer(body.live.prompt);
        follow(new AssistantBubble());
      } else if (!body.turns.length) {
        showEmpty();
      }
      scrollDown();
    });
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (streaming) stop(); else send();
  });
  input.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
      ev.preventDefault();
      if (!streaming) send();
    }
  });
  input.addEventListener("input", autosize);

  newChatBtn.addEventListener("click", function () {
    if (streaming || !chatId) return;
    newChatBtn.disabled = true;
    api("/api/chats/" + encodeURIComponent(chatId), { method: "DELETE" })
      .catch(function () { /* already gone */ })
      .then(startNewChat)
      .finally(function () { newChatBtn.disabled = false; input.focus(); });
  });

  var saved = storageGet();
  (saved ? restore(saved).catch(startNewChat) : startNewChat()).catch(function (err) {
    messagesEl.textContent = "";
    var b = el("div", "banner", "Could not reach the chat server: " + err.message);
    messagesEl.appendChild(b);
  });
})();
</script>
</body>
</html>
